<!DOCTYPE html>
<html>

<head>
    <!-- Including Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Setting the title and character encoding -->
    <title>Natural Burial - Booking Form</title>
    <meta charset="UTF-8">
    <meta name="keywords" content="natural burial, booking form">
</head>

<body class="bg-gray-100 dark:bg-gray-800 text-black dark:text-white">
    <script src="script.js"></script>
    <!-- Header section -->
    <header class="p-4">
        <!-- Title for authors -->
        <h2 class="text-2xl font-bold">Authors:</h2>
        <!-- List of authors -->
        <ul class="mt-4">
            <!-- Group Leader -->
            <li>Group Leader: Prince Kelly</li>
            <!-- Other group members -->
            <li>Bhanu Prakash</li>
            <li>Kasi Ellis</li>
            <li>Prajwal Shetty</li>
        </ul>
    </header>
    <!-- Main content section -->
    <main class="p-4">
        <!-- Main heading -->
        <h1 class="text-4xl font-bold">Booking Form</h1>
        <!-- Form for user input -->
        <form action="submit.php" method="POST">
            <!-- Fieldset for personal information -->
            <fieldset class="mb-4">
                <!-- Legend for personal information -->
                <legend class="text-6xl font-bold mb-2">Personal Information</legend>
                <!-- Input field for full name -->
                <label for="fullName" class="block text-6xl">Full Name:</label><br>
                <input type="text" id="fullName" name="fullName" required
                       class="w-full px-4 py-2 border border-black rounded-md mb-2 text-6xl"><img class="help h-36 w-36"
                                                                                                  src="asssets/loud-speaker.png" onclick="playAudio('asssets/Enter your Full Name.mp3')"><br><br>
                <!-- Input field for date of birth -->
                <label for="dob" class="block text-6xl">Date of Birth:</label><br>
                <input type="date" id="dob" name="dob" required
                       class="w-full px-4 py-2 border border-black rounded-md mb-2 text-6xl"><img class="help h-36 w-36"
                                                                                                  src="asssets/loud-speaker.png" onclick="playAudio('asssets/Enter your Date of birth.mp3')"><br><br>
                <!-- Input field for email -->
                <label for="email" class="block text-6xl">Email:</label><br>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-2 border border-black rounded-md mb-2 text-6xl"><img class="help h-36 w-36"
                                                                                                  src="asssets/loud-speaker.png" onclick="playAudio('asssets/Enter your Email.mp3')"><br><br>
                <!-- Input field for phone number -->
                <label for="phone" class="block text-6xl">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" required
                       class="w-full px-4 py-2 border border-black rounded-md mb-2 text-6xl"><img class="help h-36 w-36"
                                                                                                  src="asssets/loud-speaker.png" onclick="playAudio('asssets/Enter your Phone Number.mp3')"><br><br>
                <!-- Textarea for address -->
                <label for="address" class="block text-6xl">Address:</label><br>
                <textarea id="address" name="address" required
                          class="w-full px-4 py-2 border border-black rounded-md mb-2"></textarea><img class="help h-36 w-36"
                                                                                                       src="asssets/loud-speaker.png" onclick="playAudio('asssets/Enter your Address.mp3')"><br><br>
                <!-- Input field for city -->
                <label for="city" class="block text-6xl">City:</label><br>
                <input type="text" id="city" name="city" required
                       class="w-full px-4 py-2 border border-black rounded-md mb-2 text-6xl"><img class="help h-36 w-36"
                                                                                                  src="asssets/loud-speaker.png" onclick="playAudio('asssets/Enter your City.mp3')"><br><br>
                <!-- Input field for state -->
                <label for="state" class="block text-6xl">State:</label><br>
                <input type="text" id="state" name="state" required
                       class="w-full px-4 py-2 border border-black rounded-md mb-2 text-6xl"><img class="help h-36 w-36"
                                                                                                  src="asssets/loud-speaker.png" onclick="playAudio('asssets/Enter your State .mp3')"><br><br>
                <!-- Input field for ZIP code -->
                <label for="zip" class="block text-6xl">ZIP Code:</label><br>
                <input type="text" id="zip" name="zip" required
                       class="w-full px-4 py-2 border border-black rounded-md mb-2 text-6xl"><img class="help h-36 w-36"
                                                                                                  src="asssets/loud-speaker.png" onclick="playAudio('asssets/Enter your ZIP code.mp3')"><br><br>
            </fieldset>
            <!-- Fieldset for natural burial preferences -->
            <fieldset class="mb-4">
                <!-- Legend for burial preferences -->
                <legend class="text-6xl font-bold mb-2">Natural Burial Preferences</legend>
                <!-- Radio buttons for preferred burial method -->
                <div class="mb-4">
                    <input type="radio" id="coralReef" name="burialMethod" value="coralReef" required
                           class="transform scale-75 mr-4">
                    <label class="radio-label text-6xl" for="coralReef">Coral Reef</label><br>
                    <input type="radio" id="skyBurial" name="burialMethod" value="skyBurial" required
                           class="transform scale-75 mr-4">
                    <label class="radio-label text-6xl" for="skyBurial">Sky Burial</label><br>
                    <input type="radio" id="seaBurial" name="burialMethod" value="seaBurial" required
                           class="transform scale-75 mr-4">
                    <label class="radio-label text-6xl" for="seaBurial">Burial At Sea</label><br>
                    <input type="radio" id="treePod" name="burialMethod" value="treePod" required
                           class="transform scale-75 mr-4">
                    <label class="radio-label text-6xl" for="treePod">Tree Pod</label><br>
                </div><img class="help h-36 w-36" src="asssets/loud-speaker.png" onclick="playAudio('asssets/Select your Preferred Burial Method.mp3')"><br><br>
                <!-- Radio buttons for preferred grave site marker -->
                <div class="mb-4">
                    <input type="radio" id="tree" name="graveMarker" value="tree" required
                           class="transform scale-75 mr-4">
                    <label class="radio-label text-6xl" for="tree">Tree</label><br>
                    <input type="radio" id="rock" name="graveMarker" value="rock" required
                           class="transform scale-75 mr-4">
                    <label class="radio-label text-6xl" for="rock">Rock</label><br>
                    <input type="radio" id="wildflower" name="graveMarker" value="wildflower" required
                           class="transform scale-75 mr-4">
                    <label class="radio-label text-6xl" for="wildflower">Wildflower</label><br>
                </div><img class="help h-36 w-36" src="asssets/loud-speaker.png" onclick="playAudio('asssets/Select your Preferred Grave Site Marker.mp3')"><br>
                <!-- Paragraph for photo examples of grave markers -->
                <p class="text-6xl">Photo Examples:</p>
                <!-- Images of different grave markers -->
                <img class="imgMark h-250 w-250" onmouseover="bigImg(this)" onmouseout="normImg(this)"
                     src="asssets/tree.jpeg" title="A burial marker that uses a tree or log as a signifier">
                <img class="imgMark h-250 w-250" onmouseover="bigImg(this)" onmouseout="normImg(this)"
                     src="asssets/rock.jpeg" title="A burial marker that uses a large rock or boulder as a signifier">
                <img class="imgMark h-250 w-250" onmouseover="bigImg(this)" onmouseout="normImg(this)"
                     src="asssets/flower.jpeg" title="A burial marker that uses wild flowers as a signifier">
                <br><br>
                <!-- Textarea for choosing an inscription for the marker -->
                <label for="enscript" class="block text-6xl">Choose an Enscription for the Marker:</label><br>
                <textarea id="enscript" name="enscript" required
                          class="w-full px-4 py-2 border border-black rounded-md mb-2 text-6xl"></textarea><img class="help h-36 w-36"
                                                                                                       src="asssets/loud-speaker.png" onclick="playAudio('asssets/Choose an Enscription for the Marker.mp3')"><br><br>
                <!-- Input field for preferred plot size -->
                <label for="plotSize" class="block text-6xl">Preferred Plot Size:</label><br>
                <input type="number" id="plotSize" name="plotSize" min="1" required
                       class="w-full px-4 py-2 border border-black rounded-md mb-2 text-6xl"><a class="block text-6xl">square feet</a><img class="help h-36 w-36"
                                                                                                                    src="asssets/loud-speaker.png" onclick="playAudio('asssets/Enter Preferred Plot Size.mp3')"><br><br>
                <!-- Textarea for additional information -->
                <label for="additionalInfo" class="block text-6xl">Additional Information:</label><br>
                <textarea id="additionalInfo" name="additionalInfo"
                          class="w-full px-4 py-2 border border-black rounded-md mb-2 text-6xl"></textarea><img class="help h-36 w-36"
                                                                                                       src="asssets/loud-speaker.png" onclick="playAudio('asssets/( Additional Information).mp3')"><br><br>
            </fieldset>
            <!-- Submit button for the form -->
            <input type="submit" value="Submit" class="px-4 py-2 bg-black text-white rounded-md">
        </form>
    </main>
</body>

</html>
